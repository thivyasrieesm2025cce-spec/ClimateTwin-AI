<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClimateTwin AI - Climate Impact Simulator</title>
<meta name="description" content="ClimateTwin AI is a software-only digital twin that lets campus and city planners simulate a development change, compare heat, runoff, energy and carbon impacts, and pick the most climate-conscious option before building.">
<meta name="theme-color" content="#174B38">
<meta property="og:title" content="ClimateTwin AI - Simulate before you build">
<meta property="og:description" content="Propose a change, simulate its climate impact, compare alternatives, act. PCCOE International Grand Challenge 2026, AI for Climate Change.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed left sidebar + top bar + dashboard grid. One calm light theme (forest green on warm white). */
:root {
  --forest: #174B38;
  --forest-2: #1F5E47;
  --ivory: #F7F8F4;
  --soft: #DCEBDD;
  --slate: #344054;
  --amber: #E8B86D;
  --border: #E5E7EB;
  --white: #FFFFFF;
  --muted: #5B6573;
  --faint: #EEF1EA;
  --ink: #1D2939;
  --base: #8A9791;
  --prop: #174B38;
  --warn-bg: #FBEFD5;
  --warn-ink: #6B4403;
  --bad: #A4332B;
  --bad-bg: #FBE9E7;
  --blue: #376C9B;
  --r: 12px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; background: var(--ivory); color: var(--slate); font-family: var(--font); font-size: 15px; line-height: 1.5; font-weight: 400;
  padding-left: 0; padding-right: 0;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { margin: 0; color: var(--ink); font-weight: 600; text-wrap: balance; }
p { margin: 0; }
a { color: var(--forest); text-underline-offset: 2px; }
b, strong { font-weight: 600; }
code { font-size: 13px; background: var(--faint); padding: 1px 5px; border-radius: 5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.strong { font-weight: 600; color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
:focus-visible { outline: 3px solid #2C7A5B; outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--forest); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 8px; }

/* shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--forest); color: #E9F2EC; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand.sm { color: #fff; font-weight: 600; }
.brandmark { width: 30px; height: 30px; border-radius: 9px; background: var(--soft); position: relative; flex: none; }
.brandmark::before { content: ""; position: absolute; left: 7px; top: 7px; width: 16px; height: 16px; border: 2.5px solid var(--forest); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
.brandname { color: #fff; font-weight: 600; font-size: 16px; line-height: 1.2; }
.brandname b { color: var(--amber); }
.brand.sm b { color: var(--amber); }
.brandsub { font-size: 12px; color: #B7CFC1; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: #D5E6DB; font: inherit; font-weight: 500; font-size: 14px; padding: 9px 10px; border-radius: 9px; cursor: pointer; text-align: left; }
.nav-item:hover { background: rgba(255, 255, 255, .08); }
.nav-item[aria-current="page"] { background: var(--soft); color: var(--forest); font-weight: 600; }
.nav-item .ico { flex: none; }
.side :focus-visible { outline-color: #fff; }
.sidefoot { margin-top: auto; font-size: 13px; color: #CFE2D6; display: flex; flex-direction: column; gap: 6px; padding: 0 6px; }
.sidefoot .tiny { color: #9CBBA9; }
.mtop { display: none; }
main { min-width: 0; padding-bottom: 80px; }
main:focus { outline: none; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; padding: 12px 32px; background: rgba(247, 248, 244, .96); border-bottom: 1px solid var(--border); }
.tb-campus { font-weight: 600; color: var(--ink); font-size: 15px; }
.tb-sub { font-size: 12px; color: var(--muted); }
.tb-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#page { padding: 28px 32px 0; max-width: 1360px; }

.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; margin-bottom: 20px; }
.pagehead h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin-top: 4px; max-width: 62ch; }
.pageactions { display: flex; flex-wrap: wrap; gap: 8px; }

/* buttons, chips, badges */
.btn { font: inherit; font-weight: 500; font-size: 14px; border-radius: 10px; padding: 9px 16px; border: 1px solid transparent; cursor: pointer; line-height: 1.2; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.sm { padding: 6px 12px; min-height: 32px; font-size: 13px; border-radius: 8px; }
.btn-primary { background: var(--forest); color: #fff; }
.btn-primary:hover { background: var(--forest-2); }
.btn-secondary { background: var(--white); color: var(--forest); border-color: #C7D4CB; }
.btn-secondary:hover { background: var(--soft); }
.btn-ghost { background: transparent; color: var(--forest); }
.btn-ghost:hover { background: var(--faint); }
.btn-ghost.on-dark { color: #fff; }
.btn-danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip-good { background: var(--soft); color: var(--forest); }
.chip-warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip-flat { background: var(--faint); color: var(--muted); }
.chip-scn { background: var(--white); border: 1px solid var(--border); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; padding: 6px 12px; font-size: 13px; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 6px; vertical-align: middle; margin-left: 6px; }
.b-real { background: var(--soft); color: var(--forest); }
.b-illus { background: var(--warn-bg); color: var(--warn-ink); }
.b-assume { background: #EEE9F7; color: #4B3A86; }
.b-calc { background: #E3EEF7; color: #1F4E79; }
.b-model { background: #E0F1EF; color: #0F5A53; }
.b-none { background: var(--faint); color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* cards and grids */
.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; min-width: 0; margin-bottom: 20px; }
.grid > .card, .stack > .card { margin-bottom: 0; }
.card-title { font-size: 18px; margin-bottom: 12px; line-height: 1.3; }
.card.accent { background: var(--soft); border-color: #C3DAC7; }
.grid { display: grid; gap: 20px; margin-bottom: 20px; align-items: start; }
.grid > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.grid.flat { margin: 0; }
.notice { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid #F0DDB0; border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; font-size: 14px; }
.alert { border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
.alert.warn { background: var(--warn-bg); color: var(--warn-ink); }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
@media (min-width: 1100px) {
  .g-7-5 { grid-template-columns: 7fr 5fr; }
  .g-8-4 { grid-template-columns: 8fr 4fr; }
  .g-4-8 { grid-template-columns: 4fr 8fr; }
  .g-2 { grid-template-columns: 1fr 1fr; }
  .sticky { position: sticky; top: 84px; }
  .grid.top { align-items: start; }
}
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }
.empty p { color: var(--muted); max-width: 52ch; }
.plain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.plain.bullets, .plain.nums { list-style: revert; padding-left: 20px; }
.plain.items { margin: 10px 0; font-size: 14px; }
.rowline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.rowline:last-child { border-bottom: 0; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .tiles { grid-template-columns: 1fr; } }
.tile { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile h3 { font-size: 13px; font-weight: 500; color: var(--muted); }
.tile-val { font-size: 30px; font-weight: 600; color: var(--ink); line-height: 1.1; letter-spacing: -0.01em; }
.tile-val .unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 5px; letter-spacing: 0; }
.tile-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.tile .hint { margin-top: 2px; font-size: 12.5px; }

/* map */
.card-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-bottom: 12px; }
.seg-ctl { display: inline-flex; background: var(--faint); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg-ctl button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--slate); padding: 6px 12px; border-radius: 8px; cursor: pointer; min-height: 32px; }
.seg-ctl button[aria-pressed="true"] { background: var(--white); color: var(--forest); box-shadow: 0 0 0 1px var(--border); font-weight: 600; }
.mapwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--ivory); }
svg.map { display: block; width: 100%; min-width: 0; height: auto; }
@media (max-width: 700px) { svg.map { min-width: 600px; } }
svg.map .zone { cursor: pointer; }
svg.map .zone:hover rect:first-child { filter: brightness(.97); }
svg.map .zone:focus-visible { outline: none; }
svg.map .zone:focus-visible rect:first-child { stroke: #2C7A5B; stroke-width: 4; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0; margin: 10px 0 0; font-size: 12.5px; color: var(--slate); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.base, .pb-bar.base { background: var(--base); }
.sw.prop, .pb-bar.prop { background: var(--prop); }
.ramp-legend { display: flex; align-items: center; gap: 10px; font-size: 12.5px; margin-top: 10px; }
.ramp-legend i { flex: 0 1 240px; height: 10px; border-radius: 5px; display: block; }
.alt { margin-top: 14px; }
.alt summary { cursor: pointer; font-weight: 500; color: var(--forest); }
.compbar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--faint); margin: 12px 0 0; }
.compbar.tall { height: 16px; }
.compbar .seg { display: block; height: 100%; }

/* priority list */
.priolist { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 14px; }
.prio { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.rank { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--forest); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.prio-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.prio-facts { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.meter { display: block; height: 6px; border-radius: 3px; background: var(--faint); margin-top: 6px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--amber); border-radius: 3px; }
.next h3 { font-size: 17px; margin: 6px 0 8px; }
.next p { margin-bottom: 12px; font-size: 14px; }

/* charts */
.two-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
figure { margin: 0; min-width: 0; }
figcaption { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
svg.chart { width: 100%; height: auto; display: block; }
.pb { display: flex; flex-direction: column; gap: 18px; }
.pb-label { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
.pb-line { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 10px; align-items: center; margin-bottom: 4px; }
.pb-track { display: block; height: 14px; background: var(--faint); border-radius: 7px; overflow: hidden; }
.pb-bar { display: block; height: 100%; border-radius: 0 7px 7px 0; min-width: 2px; }
.pb-val { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pb-val.strong { font-weight: 600; color: var(--ink); }
.legend.inline { margin-top: 16px; }
.legendnote { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; margin-bottom: 16px; align-items: center; }
.legendnote span { display: inline-flex; align-items: center; gap: 6px; }
.ib { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ib-row { display: grid; grid-template-columns: minmax(130px, 220px) minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.ib-track { display: block; height: 10px; background: var(--faint); border-radius: 5px; overflow: hidden; }
.ib-bar { display: block; height: 100%; background: var(--forest); border-radius: 0 5px 5px 0; }
.ib-val { text-align: right; font-variant-numeric: tabular-nums; }

/* tables */
.tablewrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.tbl thead th { font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--ivory); white-space: nowrap; }
.tbl tbody th { font-weight: 500; color: var(--ink); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl.compact th, .tbl.compact td { padding: 7px 10px; font-size: 13.5px; }
.tbl .totalrow th, .tbl .totalrow td { font-weight: 600; background: var(--faint); }
.tbl td.win { background: var(--soft); font-weight: 600; color: var(--forest); }
.tbl td.actions { white-space: nowrap; }
.provtbl td, .provtbl th { font-size: 13px; }
.provtbl { min-width: 760px; }
.chk input { width: 18px; height: 18px; accent-color: var(--forest); }
.inline-input { font: inherit; padding: 6px 8px; border: 1px solid #98A2B3; border-radius: 8px; margin-right: 6px; width: 200px; max-width: 100%; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 500; color: var(--ink); }
input[type="text"], input[type="number"], textarea, select { font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid #98A2B3; border-radius: 9px; background: #fff; color: var(--ink); width: 100%; min-height: 40px; }
textarea { resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 18px; }
.formmsg { font-size: 13px; min-height: 18px; color: var(--bad); margin: 4px 0; }
.formmsg.ok { color: var(--forest); }
.editform { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.editform h4 { margin-bottom: 4px; }
.kv { margin: 14px 0; display: grid; gap: 8px; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.kv.wide > div { flex-direction: column; gap: 2px; }
.kv.wide dd { text-align: left; }
.zname { font-size: 20px; }

/* simulator */
.presetbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 20px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab { font: inherit; font-size: 14px; font-weight: 500; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--slate); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tab[aria-selected="true"] { color: var(--forest); border-bottom-color: var(--forest); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); display: inline-block; }
.zonehead { display: flex; justify-content: space-between; }
.slgrid { display: flex; flex-direction: column; gap: 22px; margin-top: 20px; }
.slgroup h4 { font-size: 14px; color: var(--forest); margin-bottom: 8px; }
.slrow { padding: 10px 0; border-bottom: 1px solid var(--border); }
.slrow.off { opacity: .55; }
.sl-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sl-top label { font-size: 14px; font-weight: 500; color: var(--ink); }
.sl-top output { font-size: 14px; font-weight: 600; color: var(--forest); font-variant-numeric: tabular-nums; }
.sl-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; gap: 8px; }
input[type="range"] { width: 100%; accent-color: var(--forest); height: 28px; margin: 4px 0 0; cursor: pointer; }
.lr-list { display: flex; flex-direction: column; gap: 12px; margin: 12px 0; }
.lr-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--ink); flex-wrap: wrap; }
.lr-vals { font-size: 13.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.costbox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--ivory); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 12px 0; }
.costbox.big { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.costbox > div { display: flex; flex-direction: column; font-size: 13px; }
.costbox strong { font-size: 18px; color: var(--ink); }

/* recommendations */
.rec { border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 14px; }
.rec-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.rec h3 { font-size: 16px; margin: 2px 0 2px; }
.score { background: var(--soft); color: var(--forest); border-radius: 10px; padding: 6px 12px; text-align: center; flex: none; }
.score strong { font-size: 22px; }
.score span { font-size: 12px; margin-left: 2px; }
.rec p { font-size: 14px; margin-top: 8px; }
.rec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 12px 0; }
.benefit, .tradeoff { border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
.benefit { background: var(--soft); }
.tradeoff { background: var(--warn-bg); color: var(--warn-ink); }
.benefit ul { margin-top: 4px; gap: 3px; }
.tradeoff p { margin-top: 4px; font-size: 13.5px; }
.weights { display: flex; flex-direction: column; gap: 10px; }
.wrow { display: grid; grid-template-columns: 1fr 34px; column-gap: 8px; row-gap: 0; align-items: center; }
.wrow label { font-size: 14px; font-weight: 500; color: var(--ink); grid-column: 1; }
.wrow output { grid-column: 2; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.wrow input { grid-column: 1 / -1; }
.wrow .tiny { grid-column: 1 / -1; }
.optres { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.optres h3 { font-size: 16px; }

/* methodology */
.methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.method h4 { font-size: 14px; margin-bottom: 4px; color: var(--forest); }
.method p { font-size: 14px; }
.card h3 { font-size: 15px; margin: 18px 0 6px; }
.card h4 { font-size: 15px; margin-bottom: 8px; }

/* modal, tour, toast */
.scrim { position: fixed; inset: 0; background: rgba(16, 24, 20, .45); z-index: 60; }
.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 14px; padding: 22px; border: 1px solid var(--border); }
.modal.wide { width: min(860px, calc(100vw - 32px)); }
.modal h2 { font-size: 20px; margin-bottom: 4px; }
.modal .field { margin-top: 12px; }

 *
 * Methods (all documented on the Methodology page of the app):
 *   - Storm runoff:   NRCS/SCS Curve Number, event based (Q = (P-Ia)^2 / (P-Ia+S), Ia = 0.2 S)
 *   - Surface heat:   area-weighted midday surface temperature from per-material excess over air temperature
 *   - Energy:         baseline cooling electricity (user input) minus roof retrofit savings per m2
 *   - Solar:          canopy area x yield per m2
 *   - Carbon:         net electricity x grid emission factor

    pavedImp: 'Paved, impervious (asphalt / concrete)',
    pavedPv: 'Paved, shaded by solar canopy',
    pavedPerm: 'Paved, permeable',
    roofStd: 'Roof, standard',
    roofCool: 'Roof, cool (high albedo)',
    roofGreen: 'Roof, green',
    lawn: 'Lawn and open vegetation',
    canopy: 'Tree canopy'
  };

  var IV_KEYS = ['treesLawn', 'treesPaved', 'depavePerm', 'depaveLawn', 'coolRoof', 'greenRoof', 'solarCanopy', 'rwhTank'];

  var DEFAULT_SETTINGS = {
    ambientC: 37.8,      // Pune, mean daily maximum of the hottest month (April), 1991-2020 normals
    stormMm: 75,         // 24 h design storm depth - ASSUMPTION, replace with an IMD return-period value
    gridEF: 0.716,       // kg CO2e / kWh, CEA CO2 Baseline Database v19 - verify the latest edition
    tariff: 8.5,         // INR / kWh - ASSUMPTION
    et0: 4.5,            // mm / day reference evapotranspiration - ASSUMPTION
    irrigDays: 200,      // irrigated days per year - ASSUMPTION
    irrigEff: 0.85,
    canopyPerTree: 14,   // m2 of ground shaded per tree, about 10 years after planting (maturity preset)
    solarYield: 200,     // kWh per m2 of canopy per year - ASSUMPTION

    annualRainMm: 866,   // Pune annual normal 1991-2020

/* ===== ClimateTwin AI - page renderers ===== */

var PAGES = [
  { id: 'overview', label: 'Overview', icon: 'overview' },
  { id: 'twin', label: 'Digital Twin', icon: 'twin' },
  { id: 'simulator', label: 'Scenario Simulator', icon: 'sim' },
  { id: 'comparison', label: 'Impact Comparison', icon: 'cmp' },
  { id: 'recommendations', label: 'Recommendations', icon: 'rec' },
  { id: 'history', label: 'Scenario History', icon: 'hist' },
  { id: 'methodology', label: 'Data and Methodology', icon: 'meth' },
  { id: 'settings', label: 'Settings', icon: 'set' }
];
function pageMeta(id) { return PAGES.filter(function (p) { return p.id === id; })[0] || PAGES[0]; }

var BADGES = {
  real: ['Real observation', 'b-real'],
  illus: ['Sample data', 'b-illus'],
  assume: ['Assumption', 'b-assume'],
  calc: ['Calculated estimate', 'b-calc'],
  model: ['Model prediction (ML)', 'b-model'],
  none: ['Not integrated yet', 'b-none']
};
function badge(t) { return '<span class="badge ' + BADGES[t][1] + '">' + BADGES[t][0] + '</span>'; }
function card(title, body, cls, extra) {
  return '<section class="card ' + (cls || '') + '"' + (extra || '') + '>' + (title ? '<h2 class="card-title">' + title + '</h2>' : '') + body + '</section>';
}
function pageHead(title, sub, actions) {
  return '<div class="pagehead"><div><h1>' + esc(title) + '</h1><p class="sub">' + esc(sub) + '</p></div>' + (actions ? '<div class="pageactions">' + actions + '</div>' : '') + '</div>';
}
function emptyBox(title, body, action) {
  return '<div class="empty"><strong>' + esc(title) + '</strong><p>' + body + '</p>' + (action || '') + '</div>';
}

/* ---------- shell ---------- */
function shell() {
  var nav = PAGES.map(function (p) {
    return '<button type="button" class="nav-item" data-nav="' + p.id + '"' + (state.page === p.id ? ' aria-current="page"' : '') + '>' + iconSvg(p.icon) + '<span>' + esc(p.label) + '</span></button>';
  }).join('');
  return '<a class="skip" href="#main-content">Skip to content</a>' +
    '<div class="app">' +
    '<header class="mtop"><div class="brand sm"><span class="brandmark" aria-hidden="true"></span><span>ClimateTwin <b>AI</b></span></div>' +
    '<button type="button" class="btn btn-ghost on-dark" data-action="menu" aria-expanded="' + state.menuOpen + '" aria-controls="sidenav">' + (state.menuOpen ? 'Close' : 'Menu') + '</button></header>' +
    '<aside class="side' + (state.menuOpen ? ' open' : '') + '" id="sidenav">' +
    '<button type="button" class="brand brandbtn" data-action="home" aria-label="ClimateTwin AI home"><span class="brandmark" aria-hidden="true"></span><div><div class="brandname">ClimateTwin <b>AI</b></div><div class="brandsub">Climate Impact Simulator</div></div></button>' +
    '<nav aria-label="Primary" class="nav">' + nav + '</nav>' +
    '<div class="sidefoot"><p>Simulate before you build.</p><p class="tiny">AI for Climate Change &middot; PCCOE International Grand Challenge 2026</p></div>' +
    '</aside>' +
    '<main id="main-content" tabindex="-1"><div class="topbar" id="topbar">' + topbar() + '</div><div id="page">' + pageHtml() + '</div></main>' +
    '</div><div id="modal-root">' + modalHtml() + '</div><div id="tour-root">' + tourHtml() + '</div>' +
    '<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="sr-live" class="sr" aria-live="polite"></div>';
}
function topbar() {
  var empty = planIsEmpty();
  return '<div class="tb-left"><div class="tb-campus">PCCOE Pune &middot; demo layout</div><div class="tb-sub">Pune, Maharashtra &middot; 866 mm yearly rain &middot; 37.8 °C April mean maximum</div></div>' +
    '<div class="tb-right"><span class="chip chip-scn" title="' + esc(state.desc) + '"><span class="muted">Scenario</span> <strong>' + esc(state.name) + '</strong></span>' +
    '<button type="button" class="btn btn-secondary" data-action="reset-plan"' + (empty ? ' disabled' : '') + '>Reset</button>' +
    '<button type="button" class="btn btn-primary" data-action="open-save"' + (empty ? ' disabled' : '') + '>Save run</button></div>';
}
function pageHtml() {
  var fn = { overview: pageOverview, twin: pageTwin, simulator: pageSimulator, comparison: pageComparison, recommendations: pageRecommendations, history: pageHistory, methodology: pageMethodology, settings: pageSettings }[state.page] || pageOverview;
  return fn();
}

/* ---------- overview ---------- */
function tileHtml(m) {
  var rng = m.range && isChanged(m) ? '<p class="hint">Range of change: ' + sgn(m.range.lo, m.d) + ' to ' + sgn(m.range.hi, m.d) + ' ' + esc(m.unit) + '</p>' : '';
  return '<article class="tile"><h3>' + esc(m.short || m.label) + '</h3>' +
    '<div class="tile-val">' + nd(m.p, m.d) + '<span class="unit">' + esc(m.unit) + '</span></div>' +
    '<div class="tile-meta">' + deltaChip(m) + '<span class="muted">Baseline ' + nd(m.b, m.d) + '</span></div>' +
    rng + '<p class="hint">' + esc(m.hint) + '</p></article>';
}
function pageOverview() {
  var sim = getSim(), rows = metricRows(sim), empty = planIsEmpty();
  var tiles = ['green', 'imp', 'temp', 'runoff', 'cool', 'co2'].map(function (id) { return tileHtml(rowById(rows, id)); }).join('');
  var facts = zoneFacts(sim).sort(function (a, b) { return b.priority - a.priority; });
  var prio = facts.map(function (f, i) {
    return '<li class="prio"><span class="rank">' + (i + 1) + '</span><div class="prio-main"><div class="prio-top"><strong>' + esc(f.name) + '</strong><span class="muted">' + nd(f.priority, 0) + '/100</span></div>' +
      '<span class="meter" aria-hidden="true"><span style="width:' + f.priority + '%"></span></span>' +
      '<div class="prio-facts">' + nd(f.impPct, 0) + '% impervious &middot; ' + nd(f.temp, 1) + ' °C midday surface &middot; ' + nd(f.qDepth, 0) + ' mm runoff</div></div>' +
      '<button type="button" class="btn btn-ghost sm" data-action="inspect" data-zone="' + f.id + '">Inspect</button></li>';
  }).join('');
  var cands = scoreCandidates(buildCandidates(), state.weights), top = cands[0];
  var next = top ? '<div class="next"><span class="eyebrow">Recommended next action</span><h3>' + esc(CAND_META[top.key].title) + ' in ' + esc(top.zoneName) + '</h3><p>' + esc(whyText(top, sim.settings)) + '</p>' +
    '<div class="row"><button type="button" class="btn btn-primary" data-action="try-cand" data-i="0">Try it in the simulator</button><button type="button" class="btn btn-secondary" data-nav="recommendations">See all ranked actions</button></div></div>' : '';
  var rec = state.saved.slice(0, 3).map(function (s) {
    return '<li class="rowline"><div><strong>' + esc(s.name) + '</strong><div class="muted tiny">' + esc(s.created || '') + '</div></div><button type="button" class="btn btn-ghost sm" data-action="load-saved" data-id="' + s.id + '">Open</button></li>';
  }).join('');
  var viewToggle = empty ? '' : '<div class="seg-ctl" role="group" aria-label="Map view"><button type="button" data-action="view" data-v="baseline" aria-pressed="' + (state.view === 'baseline') + '">Baseline</button><button type="button" data-action="view" data-v="proposed" aria-pressed="' + (state.view === 'proposed') + '">Proposed</button></div>';
  var view = empty ? 'baseline' : state.view;
  return pageHead('Climate Overview', 'Explore climate impacts before making development decisions.',
    '<button type="button" class="btn btn-primary" data-action="start-tour">Start guided demo</button><button type="button" class="btn btn-secondary" data-nav="simulator">Open simulator</button>') +
    '<div class="notice"><strong>Sample data, not a survey.</strong> Zone areas and baseline cooling electricity are demonstration values for the PCCOE campus. Edit them in Digital Twin. All results below are <strong>calculated estimates</strong>; only the Pune climate normals are real observations.' + dataTypeLegend(false) + '</div>' +
    '<div class="tiles">' + tiles + '</div>' +
    '<div class="grid g-7-5">' +
    card('Campus digital twin <span class="badge b-illus">Illustrative layout</span>', '<div class="card-tools">' + layerToggle() + viewToggle + '</div><div class="mapwrap">' + mapSvg(sim, state.layer, view, state.selZone) + '</div>' + layerLegend(state.layer) + (next ? '<div class="accent-inline">' + next + '</div>' : ''), 'span') +
    '<div class="stack">' + card('Where to act first', '<p class="hint">Zones ranked by midday surface heat, storm runoff and share of impervious surface.</p><ol class="priolist">' + prio + '</ol>') + '</div>' +
    '</div>' +
    '<div class="grid g-2">' +
    card('Pune climate context <span class="badge b-real">Real external data</span>',
      '<div class="two-charts"><figure><figcaption>Monthly rainfall, mm</figcaption>' + rainChart() + '</figure><figure><figcaption>Average daily maximum, °C</figcaption>' + tempChart() + '</figure></div>' +
      '<p class="hint">Normals 1991–2020 from a public compilation of Pune station data (climate-zone.com), converted from °F and inches. June to September bring about 83% of the 866 mm yearly rain. The April mean maximum of 37.8 °C sets the hot-day air temperature used by the heat indicator.</p>') +
    card('Recent scenario activity', rec ? '<ul class="plain">' + rec + '</ul>' : emptyBox('Nothing saved yet', 'Build a scenario in the simulator and choose Save run. Saved scenarios appear here.', '<button type="button" class="btn btn-secondary" data-nav="simulator">Open simulator</button>')) +
    '</div>';
}
function layerToggle() {
  return '<div class="seg-ctl" role="group" aria-label="Map layer">' + Object.keys(LAYERS).map(function (k) {
    return '<button type="button" data-action="layer" data-l="' + k + '" aria-pressed="' + (state.layer === k) + '">' + esc(LAYERS[k].label) + '</button>';
  }).join('') + '</div>';
}

/* ---------- digital twin ---------- */
function coverTable(zone, ivn, S, showProp) {
  var base = CT.baseCover(zone), prop = CT.applyIv(zone, ivn, S), tb = CT.zoneTotal(zone);
  var rows = CT.COVER_KEYS.map(function (k) {
    return '<tr><th scope="row">' + esc(CT.COVER_LABELS[k]) + '</th><td class="num">' + n0(base[k]) + '</td><td class="num">' + nd(base[k] / tb * 100, 1) + '%</td>' + (showProp ? '<td class="num strong">' + n0(prop[k]) + '</td>' : '') + '</tr>';
  }).join('');
  return '<div class="tablewrap"><table class="tbl compact"><thead><tr><th scope="col">Land cover</th><th scope="col" class="num">Baseline m²</th><th scope="col" class="num">Share</th>' + (showProp ? '<th scope="col" class="num">Proposed m²</th>' : '') + '</tr></thead><tbody>' + rows +
    '<tr class="totalrow"><th scope="row">Total</th><td class="num">' + n0(tb) + '</td><td class="num">100%</td>' + (showProp ? '<td class="num strong">' + n0(tb) + '</td>' : '') + '</tr></tbody></table></div>';
}
function pageTwin() {
  var sim = getSim(), zone = zoneById(state.selZone) || state.zones[0], zr = sim.zones.filter(function (z) { return z.id === zone.id; })[0];
  var ivn = sim.plan[zone.id] || curIvZero(), empty = planIsEmpty();
  var view = empty ? 'baseline' : state.view;
  var viewToggle = empty ? '' : '<div class="seg-ctl" role="group" aria-label="Map view"><button type="button" data-action="view" data-v="baseline" aria-pressed="' + (state.view === 'baseline') + '">Baseline</button><button type="button" data-action="view" data-v="proposed" aria-pressed="' + (state.view === 'proposed') + '">Proposed</button></div>';
  var showProp = CT.IV_KEYS.some(function (k) { return ivn[k] > 0; });
  var m = zr.base, p = zr.prop;
  var inspector = '<h3 class="zname">' + esc(zone.name) + '</h3><p class="muted">' + esc(zoneTypeLabel(zone.type)) + ' &middot; ' + n0(CT.zoneTotal(zone)) + ' m²</p>' +
    compBar(CT.baseCover(zone), { tall: true }) + compLegend() +
    '<dl class="kv"><div><dt>Midday surface temperature</dt><dd>' + nd(m.surfTemp, 1) + ' °C' + (showProp ? ' &rarr; <strong>' + nd(p.surfTemp, 1) + ' °C</strong>' : '') + '</dd></div>' +
    '<div><dt>Runoff, ' + sim.settings.stormMm + ' mm storm</dt><dd>' + n0(m.runoff) + ' m³' + (showProp ? ' &rarr; <strong>' + n0(p.runoff) + ' m³</strong>' : '') + '</dd></div>' +
    '<div><dt>Composite curve number</dt><dd>' + nd(m.cn, 0) + (showProp ? ' &rarr; <strong>' + nd(p.cn, 0) + '</strong>' : '') + '</dd></div>' +
    '<div><dt>Cooling electricity</dt><dd>' + n0(m.cooling / 1000) + ' MWh/yr' + (showProp ? ' &rarr; <strong>' + n0(p.cooling / 1000) + ' MWh/yr</strong>' : '') + '</dd></div></dl>' +
    coverTable(zone, ivn, sim.settings, showProp) +
    '<div class="row"><button type="button" class="btn btn-primary" data-action="goto-sim" data-zone="' + zone.id + '">Plan changes in this zone</button><button type="button" class="btn btn-secondary" data-action="toggle-edit" aria-expanded="' + state.editOpen + '">' + (state.editOpen ? 'Close editor' : 'Edit baseline values') + '</button></div>' +
    (state.editOpen ? editForm(zone) : '');
  return pageHead('Campus Digital Twin', 'Select a zone to inspect its land cover. Change the baseline if you have measured values.') +
    '<div class="grid g-8-4">' +
    card('Site map', '<div class="card-tools">' + layerToggle() + viewToggle + '</div><div class="mapwrap">' + mapSvg(sim, state.layer, view, zone.id) + '</div>' + layerLegend(state.layer) +
      '<details class="alt"><summary>Table view of all zones</summary>' + zonesTable(sim) + '</details>', 'span') +
    card('Zone inspector <span class="badge b-illus">Illustrative areas</span>', inspector) +
    '</div>';
}
function zoneTypeLabel(t) { return { academic: 'Academic', residential: 'Residential', parking: 'Parking', green: 'Green space', sports: 'Sports', admin: 'Administration' }[t] || t; }
function zonesTable(sim) {
  var rows = sim.zones.map(function (z) {
    return '<tr><th scope="row">' + esc(z.name) + '</th><td class="num">' + n0(z.base.total) + '</td><td class="num">' + nd(z.base.greenPct || z.base.green / z.base.total * 100, 0) + '%</td><td class="num">' + nd(z.base.imp / z.base.total * 100, 0) + '%</td><td class="num">' + nd(z.base.surfTemp, 1) + '</td><td class="num">' + n0(z.base.runoff) + '</td><td class="num">' + n0(z.base.cooling / 1000) + '</td></tr>';
  }).join('');
  return '<div class="tablewrap"><table class="tbl compact"><thead><tr><th scope="col">Zone</th><th scope="col" class="num">Area m²</th><th scope="col" class="num">Green</th><th scope="col" class="num">Impervious</th><th scope="col" class="num">Surface °C</th><th scope="col" class="num">Runoff m³</th><th scope="col" class="num">Cooling MWh/yr</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
function editForm(zone) {
  var fields = CT.COVER_KEYS.map(function (k) {
    return '<div class="field"><label for="ed-' + k + '">' + esc(CT.COVER_LABELS[k]) + ' (m²)</label><input id="ed-' + k + '" type="number" inputmode="decimal" min="0" step="10" value="' + Math.round(zone[k]) + '" data-ed="' + k + '"></div>';
  }).join('');
  return '<form class="editform" data-form="edit-zone" novalidate><h4>Edit baseline: ' + esc(zone.name) + '</h4><p class="hint">Enter measured areas. All eight land-cover values together define the zone area. Existing scenario changes are re-checked against the new values.</p>' +
    '<div class="fields">' + fields + '<div class="field"><label for="ed-coolingKwh">Annual cooling electricity (kWh)</label><input id="ed-coolingKwh" type="number" inputmode="decimal" min="0" step="1000" value="' + Math.round(zone.coolingKwh) + '" data-ed="coolingKwh"></div></div>' +
    '<p class="hint" id="ed-total">Zone area: ' + n0(CT.zoneTotal(zone)) + ' m²</p><p id="ed-msg" class="formmsg" role="alert"></p>' +
    '<div class="row"><button type="submit" class="btn btn-primary">Apply values</button><button type="button" class="btn btn-secondary" data-action="reset-zone" data-zone="' + zone.id + '">Restore demo values for this zone</button><button type="button" class="btn btn-ghost" data-action="reset-all-zones">Restore whole demo layout</button></div></form>';
}

/* ---------- simulator ---------- */
function ivStep(k) { return CT.IV_META[k].unit === 'trees' ? 1 : (k === 'rwhTank' ? 5 : 50); }
function fmtq(v, k, S) {
  var meta = CT.IV_META[k];
  if (meta.unit === 'trees') return '+' + n0(v) + ' trees (' + n0(v * S.canopyPerTree) + ' m² canopy)';
  return (v > 0 ? '+' : '') + n0(v) + ' ' + meta.unit;
}
var SLIDER_GROUPS = [
  { title: 'Trees and green space', keys: ['treesPaved', 'treesLawn', 'depaveLawn'] },
  { title: 'Water and surfaces', keys: ['depavePerm', 'rwhTank'] },
  { title: 'Roofs and energy', keys: ['coolRoof', 'greenRoof', 'solarCanopy'] }
];
function sliderRow(zone, k, iv, caps, S) {
  var meta = CT.IV_META[k], cap = caps[k], dis = cap <= 0 && iv[k] <= 0;
  return '<div class="slrow' + (dis ? ' off' : '') + '"><div class="sl-top"><label for="sl-' + k + '">' + esc(meta.label) + '</label><output id="o-' + k + '" for="sl-' + k + '">' + esc(fmtq(iv[k], k, S)) + '</output></div>' +
    '<input type="range" id="sl-' + k + '" data-iv="' + k + '" min="0" max="' + Math.max(cap, iv[k], 0) + '" step="' + ivStep(k) + '" value="' + iv[k] + '"' + (dis ? ' disabled' : '') + '>' +
    '<div class="sl-foot"><span id="cap-' + k + '">' + (dis ? 'Not available in this zone' : 'Up to ' + n0(cap) + ' ' + meta.unit + ' available') + '</span><span id="cost-' + k + '">' + (iv[k] > 0 ? inr(iv[k] * S.costs[meta.costKey]) : '') + '</span></div></div>';
}
function zoneControls() {
  var zone = zoneById(state.selZone) || state.zones[0], S = state.settings, iv = curIv(zone.id), caps = CT.capacities(zone, iv, S);
  var groups = SLIDER_GROUPS.map(function (g) {
    return '<div class="slgroup"><h4>' + esc(g.title) + '</h4>' + g.keys.map(function (k) { return sliderRow(zone, k, iv, caps, S); }).join('') + '</div>';
  }).join('');
  return '<div class="zonehead"><div><h3 class="zname">' + esc(zone.name) + '</h3><p class="muted">' + esc(zoneTypeLabel(zone.type)) + ' &middot; ' + n0(CT.zoneTotal(zone)) + ' m²</p></div></div>' + compBar(CT.baseCover(zone)) + compLegend() + '<div class="slgrid">' + groups + '</div>';
}
function resultsPanel() {
  var sim = getSim(), rows = metricRows(sim), empty = planIsEmpty();
  var show = ['temp', 'runoff', 'cool', 'co2', 'irrig'].map(function (id) {
    var m = rowById(rows, id);
    return '<div class="lr"><div class="lr-top"><span>' + esc(m.short || m.label) + '</span>' + deltaChip(m) + '</div><div class="lr-vals"><span class="muted">' + nd(m.b, m.d) + '</span> &rarr; <strong>' + nd(m.p, m.d) + ' ' + esc(m.unit) + '</strong></div></div>';
  }).join('');
  var issues = sim.issues.length ? '<div class="alert warn" role="alert"><strong>Adjusted to fit the zone</strong><ul>' + sim.issues.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>' : '';
  var cost = '<div class="costbox"><div><span class="muted">Indicative cost</span><strong>' + inr(sim.cost.total) + '</strong></div><div><span class="muted">Payback on electricity savings</span><strong>' + (sim.payback ? nd(sim.payback, 1) + ' years' : 'n/a') + '</strong></div></div>';
  return '<div class="lr-list">' + show + '</div>' + cost +
    (empty ? '<p class="hint">Move a slider to see results update. Costs are planning-level assumptions you can edit in Settings.</p>' : '<p class="hint">Payback counts electricity savings only. Heat, runoff and water benefits are not given a money value.</p>') + issues;
}
function pageSimulator() {
  var S = state.settings, empty = planIsEmpty();
  var tabs = state.zones.map(function (z) {
    var changed = CT.IV_KEYS.some(function (k) { return curIv(z.id)[k] > 0; });
    return '<button type="button" class="tab" role="tab" data-action="select-zone" data-zone="' + z.id + '" aria-selected="' + (z.id === state.selZone) + '">' + esc(z.name) + (changed ? '<span class="dot" title="Has changes"></span><span class="sr"> (has changes)</span>' : '') + '</button>';
  }).join('');
  var presets = PRESETS.map(function (p) { return '<button type="button" class="btn btn-secondary sm" data-action="preset" data-id="' + p.id + '" title="' + esc(p.desc) + '">' + esc(p.name) + '</button>'; }).join('');
  return pageHead('Scenario Simulator', 'Propose changes zone by zone. Every slider updates the results straight away.') +
    '<div class="presetbar"><span class="eyebrow">Start from a preset</span><div class="row">' + presets + '</div></div>' +
    '<div class="grid g-8-4 top">' +
    card('', '<div class="tabs" role="tablist" aria-label="Campus zones">' + tabs + '</div><div id="zone-controls">' + zoneControls() + '</div>', 'span') +
    '<div class="stack sticky"><section class="card"><h2 class="card-title">Live results</h2><div class="field"><label for="scn-name">Scenario name</label><input id="scn-name" type="text" maxlength="60" value="' + esc(state.name) + '"></div>' +
    '<div class="field"><label for="scn-desc">Description</label><textarea id="scn-desc" rows="2" maxlength="240">' + esc(state.desc) + '</textarea></div>' +
    '<div id="live-results">' + resultsPanel() + '</div>' +
    '<div class="row"><button type="button" class="btn btn-primary" data-action="open-save"' + (empty ? ' disabled' : '') + ' id="btn-save2">Save scenario</button><button type="button" class="btn btn-secondary" data-nav="comparison">View comparison</button></div></section></div>' +
    '</div>';
}

/* ---------- comparison ---------- */
function pageComparison() {
  var sim = getSim(), rows = metricRows(sim), empty = planIsEmpty(), S = sim.settings;
  if (empty) {
    return pageHead('Impact Comparison', 'Baseline against the proposed scenario.') +
      card('', empty_('No scenario to compare yet', 'Choose a preset or move a slider in the simulator. The comparison then fills in with baseline, proposed and the estimated change.', '<div class="row"><button type="button" class="btn btn-primary" data-nav="simulator">Open simulator</button><button type="button" class="btn btn-secondary" data-action="preset" data-id="combined">Load the Balanced Climate Plan</button></div>'));
  }
  var chartRows = ['green', 'imp', 'shade', 'temp', 'runoff', 'irrig', 'cool', 'co2'].map(function (id) { return rowById(rows, id); });
  var table = rows.map(function (m) {
    var pc = pctChange(m), rg = m.range && isChanged(m) ? sgn(m.range.lo, m.d) + ' to ' + sgn(m.range.hi, m.d) : '–';
    return '<tr><th scope="row">' + esc(m.label) + '<div class="muted tiny">' + esc(m.unit) + '</div></th><td class="num">' + nd(m.b, m.d) + '</td><td class="num strong">' + nd(m.p, m.d) + '</td><td class="num">' + deltaChip(m) + '</td><td class="num">' + (pc == null || !isChanged(m) ? '–' : sgn(pc, 1) + '%') + '</td><td class="num">' + rg + '</td><td><span class="tiny">' + esc(m.basis) + '</span><div class="tiny muted">Confidence: ' + esc(m.conf) + '</div></td></tr>';
  }).join('');
  var worse = rows.filter(function (m) { return isChanged(m) && !isGood(m); });
  var trade = worse.length ? '<ul class="plain">' + worse.map(function (m) {
    var tail = m.id === 'irrig' ? ' More planting and green roofs need more water, and a rainwater tank only offsets part of it.' : '';

function optimizerCard(ai) {

function compareCard() {
  var picked = state.cmp.map(function (id) { return state.saved.filter(function (s) { return s.id === id; })[0]; }).filter(Boolean);
  if (picked.length < 2) return card('Compare scenarios', '<p class="hint">Tick two or three saved scenarios above to compare them side by side.</p>');
  var S = state.settings, sims = picked.map(function (s) { return CT.simulate(state.zones, s.plan, S); }), rws = sims.map(metricRows);
  var body = rws[0].map(function (m, i) {
    var vals = rws.map(function (r) { return r[i].p; }), best = m.good === 'down' ? Math.min.apply(null, vals) : Math.max.apply(null, vals);
    var tie = vals.every(function (v) { return Math.abs(v - vals[0]) < Math.pow(10, -m.d) / 2; });
    return '<tr><th scope="row">' + esc(m.label) + '<div class="tiny muted">' + esc(m.unit) + '</div></th>' + vals.map(function (v) { return '<td class="num' + (!tie && Math.abs(v - best) < Math.pow(10, -m.d) / 2 ? ' win' : '') + '">' + nd(v, m.d) + '</td>'; }).join('') + '</tr>';
  }).join('');
  var costs = sims.map(function (s) { return s.cost.total; }), cheapest = Math.min.apply(null, costs);
  body += '<tr><th scope="row">Indicative cost</th>' + costs.map(function (c) { return '<td class="num' + (c === cheapest && costs.some(function (x) { return x !== c; }) ? ' win' : '') + '">' + inr(c) + '</td>'; }).join('') + '</tr>';
  var head = picked.map(function (s, i) { return '<th scope="col" class="num">' + esc(s.name) + '</th>'; }).join('');
  return card('Compare scenarios <span class="badge b-calc">Calculated estimate</span>', '<div class="tablewrap"><table class="tbl"><thead><tr><th scope="col">Indicator</th>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div><p class="hint">Highlighted cells show the better value for each indicator. Baseline for all is the current campus layout. Costs are planning-level assumptions.</p>');
}

  if (t.solarCanopy > 0) L.push(['Solar', n0(t.solarCanopy) + ' m² × ' + S.solarYield + ' kWh/m²/yr = <b>' + n0(t.solarCanopy * S.solarYield / 1000) + ' MWh/yr</b>.']);
  var b = sim.campus.base, p = sim.campus.prop;
  L.push(['Carbon', 'Net electricity = cooling − solar: ' + n0(b.netKwh / 1000) + ' → ' + n0(p.netKwh / 1000) + ' MWh/yr. × grid factor ' + S.gridEF + ' kg CO₂e/kWh = ' + n0(b.co2) + ' → <b>' + n0(p.co2) + ' t CO₂e/yr</b>. Tree carbon storage is not counted.']);
  return card('How these numbers were calculated <span class="badge b-calc">Calculated estimate</span>',
    '<ul class="plain trace">' + L.map(function (r) { return '<li><strong>' + r[0] + '.</strong> ' + r[1] + '</li>'; }).join('') + '</ul><p class="hint">Central assumption set shown. The conservative and optimistic sets give the ranges in the matrix below. All coefficients are listed in Data and Methodology and can be edited in Settings.</p>');
}

function mlCompareCard(sim) {
  var S = sim.settings, head = 'Calculated estimate versus ML model prediction';
  if (!MODEL) return card(head, '<p class="hint">No trained model is loaded.</p>');
  if (!surrogateValid()) {
    return card(head, '<p class="hint">The ML model is switched off for the current inputs (edited zone areas, changed settings, or climate outside ' + CT.CLIMATE_RANGE.ambientC.join('–') + ' °C / ' + CT.CLIMATE_RANGE.stormMm.join('–') + ' mm). Everything shown is a calculated estimate from the formulas. Retrain with <code>python3 ml/train_surrogate.py</code> to cover these inputs.</p>');
  }
  var pr = SUR.predict(MODEL, surFeatures(sim.totals, S)), o = sim.campus.prop;
  var rows = [['Surface temperature (°C)', o.surfTemp, pr.surfTemp, 2], ['Storm runoff (m³)', o.runoff, pr.runoff, 0], ['Net electricity (MWh/yr)', o.netKwh / 1000, pr.netKwh / 1000, 0], ['Irrigation (m³/yr)', o.irrig, pr.irrig, 0]].map(function (r) {
    var d = r[2] - r[1];
    return '<tr><th scope="row">' + r[0] + '</th><td class="num">' + nd(r[1], r[3]) + '</td><td class="num">' + nd(r[2], r[3]) + '</td><td class="num">' + sgn(d, r[3]) + ' (' + sgn(r[1] ? d / Math.abs(r[1]) * 100 : 0, 2) + '%)</td></tr>';
  }).join('');
  return card(head + ' <span class="badge b-model">Model prediction (ML)</span>',
    '<p class="hint">The headline numbers in this app are calculated estimates. The neural network below is a separate, trained model that imitates the formulas. Agreement shows the model learned the engine; it does not prove either one matches the real campus.</p>' +
    '<div class="tablewrap"><table class="tbl compact"><thead><tr><th scope="col">Indicator, proposed scenario</th><th scope="col" class="num">Calculated estimate</th><th scope="col" class="num">ML prediction</th><th scope="col" class="num">Difference</th></tr></thead><tbody>' + rows + '</tbody></table></div>');
}

/* Example scenarios A, B, C for the Scenario History demo */
var EXAMPLES = [
  { name: 'Scenario A: More Trees', desc: 'About 300 trees planted in open green ground across academic, hostel, garden and sports zones.', plan: { z1: { treesLawn: 60 }, z2: { treesLawn: 60 }, z4: { treesLawn: 80 }, z5: { treesLawn: 100 } } },
  { name: 'Scenario B: Green Parking', desc: 'Main parking lot: 5,000 m² of permeable paving and 60 shade trees along the bays.', plan: { z3: { depavePerm: 5000, treesPaved: 60 } } },
  { name: 'Scenario C: Trees + Green Parking', desc: 'Scenarios A and B together.', plan: { z1: { treesLawn: 60 }, z2: { treesLawn: 60 }, z4: { treesLawn: 80 }, z5: { treesLawn: 100 }, z3: { depavePerm: 5000, treesPaved: 60 } } }
];
function loadExamples() {
  var added = 0;
  EXAMPLES.slice().reverse().forEach(function (e) {
    if (state.saved.some(function (s) { return s.name === e.name; })) return;
    state.saved.unshift({ id: uid(), name: e.name, desc: e.desc, plan: JSON.parse(JSON.stringify(e.plan)), created: today() }); added++;
  });
  persistSaved();
  state.cmp = EXAMPLES.map(function (e) { var r = state.saved.filter(function (s) { return s.name === e.name; })[0]; return r && r.id; }).filter(Boolean);
  return added;
}

/* ===== ClimateTwin AI - events and rendering ===== */

var root = null;
function render() {
  root.innerHTML = state.page === 'home' ? landingHtml() : shell();
}
function focusKey(el) {
  if (!el || !el.closest) return null;
  if (el.id) return '#' + el.id;
  var a = el.getAttribute && el.getAttribute('data-action');
  if (a) {
    var s = '[data-action="' + a + '"]';
    ['data-zone', 'data-l', 'data-v', 'data-id', 'data-i'].forEach(function (n) { if (el.getAttribute(n)) s += '[' + n + '="' + el.getAttribute(n) + '"]'; });
    return s;
  }
  var nv = el.getAttribute && el.getAttribute('data-nav');
  return nv ? '[data-nav="' + nv + '"]' : null;
}
function renderPage() {
  var key = focusKey(document.activeElement);
  var tb = $('#topbar'), pg = $('#page');
  if (tb) tb.innerHTML = topbar();
  if (pg) pg.innerHTML = pageHtml();
  if (key) { var n = $(key); if (n && n.focus) { try { n.focus({ preventScroll: true }); } catch (e) { n.focus(); } } }
}
function renderAll() {
  var key = focusKey(document.activeElement);
  render();
  if (key) { var n = $(key); if (n && n.focus) n.focus({ preventScroll: true }); }
}
function go(page, opts) {
  state.page = page; state.menuOpen = false; state.confirm = null; state.renaming = null;
  render();
  if (!(opts && opts.keepScroll)) window.scrollTo(0, 0);
  var m = $('#main-content'); if (m && !(opts && opts.noFocus)) m.focus({ preventScroll: true });
  announce(page === 'home' ? 'Home page' : pageMeta(page).label + ' page');
}
function announce(t) { var l = $('#sr-live'); if (l) { l.textContent = ''; setTimeout(function () { l.textContent = t; }, 30); } }
var toastTimer = null;
function toast(msg) {
  var t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
}

/* ---------- live updates for the simulator without losing slider focus ---------- */
function updateSimLive() {
  var zone = zoneById(state.selZone), S = state.settings, iv = curIv(zone.id), caps = CT.capacities(zone, iv, S);
  CT.IV_KEYS.forEach(function (k) {
    var sl = $('#sl-' + k); if (!sl) return;
    var meta = CT.IV_META[k], cap = caps[k];
    sl.max = Math.max(cap, iv[k], 0);
    if (+sl.value !== iv[k]) sl.value = iv[k];
    var dis = cap <= 0 && iv[k] <= 0; sl.disabled = dis;
    sl.closest('.slrow').classList.toggle('off', dis);
    $('#o-' + k).textContent = fmtq(iv[k], k, S);
    $('#cap-' + k).textContent = dis ? 'Not available in this zone' : 'Up to ' + n0(cap) + ' ' + meta.unit + ' available';
    $('#cost-' + k).textContent = iv[k] > 0 ? inr(iv[k] * S.costs[meta.costKey]) : '';
  });
  var lr = $('#live-results'); if (lr) lr.innerHTML = resultsPanel();
  var tb = $('#topbar'); if (tb) tb.innerHTML = topbar();
  var sv = $('#btn-save2'); if (sv) sv.disabled = planIsEmpty();
  $$('.tab').forEach(function (t) {
    var id = t.getAttribute('data-zone'), changed = CT.IV_KEYS.some(function (k) { return curIv(id)[k] > 0; });
    var d = $('.dot', t);
    if (changed && !d) t.insertAdjacentHTML('beforeend', '<span class="dot" title="Has changes"></span><span class="sr"> (has changes)</span>');
    if (!changed && d) { d.nextSibling && d.nextSibling.remove(); d.remove(); }
  });
}
function markCustom() {
  if (state.name === 'Baseline reference') { state.name = 'Custom scenario'; state.desc = 'Your own combination of changes.'; var n = $('#scn-name'), d = $('#scn-desc'); if (n) n.value = state.name; if (d) d.value = state.desc; }
}

/* ---------- clipboard and report ---------- */
function copyText(text) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove(); return ok;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
  }
  return Promise.resolve(fallback());
}
function downloadReport() {
  try {
    var blob = new Blob([reportHtml()], { type: 'text/html' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'climatetwin-report.html'; document.body.appendChild(a); a.click(); a.remove();
    toast('Report downloaded. If nothing happened, use Copy report.');
  } catch (e) { toast('Download is blocked here. Use Copy report instead.'); }
}

/* ---------- modal ---------- */
var lastFocus = null;
function openModal(kind) {
  lastFocus = document.activeElement; state.modal = kind;
  $('#modal-root').innerHTML = modalHtml();
  var f = $('#modal-root input, #modal-root button.btn-primary'); if (f) f.focus();
}
function closeModal() {
  state.modal = null; $('#modal-root').innerHTML = '';
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
function confirmSave() {
  var name = $('#m-name').value.trim(), desc = $('#m-desc').value.trim(), msg = $('#m-msg');
  if (!name) { msg.textContent = 'Give the scenario a name.'; $('#m-name').focus(); return; }
  if (planIsEmpty()) { msg.textContent = 'There are no changes to save. Move a slider or load a preset first.'; return; }
  if (state.saved.some(function (s) { return s.name.toLowerCase() === name.toLowerCase(); })) { msg.textContent = 'A saved scenario already has this name. Choose a different one.'; return; }
  state.name = name; state.desc = desc || 'No description.';
  state.saved.unshift({ id: uid(), name: name, desc: state.desc, plan: JSON.parse(JSON.stringify(sanitizePlan(state.plan))), created: today() });
  var ok = persistSaved();
  closeModal(); renderPage();
  toast(ok ? 'Scenario saved in this browser.' : 'Saved for this session only. Browser storage is unavailable.');
}

/* ---------- click handling ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-nav],[data-action]'); if (!t) {
    var z = e.target.closest('[data-zone]'); if (z && z.classList.contains('zone')) selectZone(z.getAttribute('data-zone'));
    return;
  }
  var nav = t.getAttribute('data-nav');
  if (nav) { go(nav); return; }
  var act0 = t.getAttribute('data-action');
  if (act0 === 'launch') { go('overview'); return; }
  if (act0 === 'home') { go('home'); return; }
  if (act0 === 'launch-tour') { go('overview'); state.tour = 0; tourStep(); return; }
  if (act0 === 'launch-preset') { var lp = presetById(t.getAttribute('data-id')); applyPlan(lp.plan, lp.name, lp.desc); go('simulator'); toast('Loaded: ' + lp.name); return; }
  if (act0 === 'hero') {
    var on = t.getAttribute('data-v') === '1', g = $('#hero-grid'), nt = $('#hero-note');
    if (g) g.innerHTML = heroTiles(on);
    $$('[data-action="hero"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); });
    if (nt) nt.textContent = on ? 'With plan: ' + nd(HERO.p.impPct, 0) + '% built-up or paved, ' + nd(HERO.p.greenPct, 0) + '% green. Runoff ' + sgn(pctDelta(HERO.b.runoff, HERO.p.runoff), 0) + '%, midday surface temperature ' + sgn(HERO.p.surfTemp - HERO.b.surfTemp, 1) + ' °C.' : 'Today: ' + nd(HERO.b.impPct, 0) + '% built-up or paved, ' + nd(HERO.b.greenPct, 0) + '% green. Balanced Climate Plan applied to the demo PCCOE layout (illustrative areas).';
    return;
  }
  var a = t.getAttribute('data-action'), id = t.getAttribute('data-id'), zid = t.getAttribute('data-zone');
  switch (a) {
    case 'menu': state.menuOpen = !state.menuOpen; render(); var mb = $('[data-action="menu"]'); if (mb) mb.focus(); break;
    case 'layer': state.layer = t.getAttribute('data-l'); renderPage(); break;
    case 'view': state.view = t.getAttribute('data-v'); renderPage(); break;
    case 'inspect': state.selZone = zid; state.editOpen = false; go('twin'); break;
    case 'select-zone': state.selZone = zid; renderPage(); break;
    case 'goto-sim': state.selZone = zid; go('simulator'); break;
    case 'toggle-edit': state.editOpen = !state.editOpen; renderPage(); break;
    case 'preset': var p = presetById(id); applyPlan(p.plan, p.name, p.desc); renderPage(); toast('Loaded: ' + p.name); break;
    case 'reset-plan': resetPlan(); renderPage(); toast('Scenario reset to baseline.'); break;
    case 'open-save': openModal('save'); break;
    case 'close-modal': closeModal(); break;
    case 'confirm-save': confirmSave(); break;
    case 'copy-report': copyText(reportMarkdown()).then(function (ok) { toast(ok ? 'Report copied as text.' : 'Copy was blocked. Open the report view and select the text.'); }); break;
    case 'view-report': openModal('report'); break;
    case 'download-report': downloadReport(); break;
    case 'load-saved': var s = state.saved.filter(function (r) { return r.id === id; })[0]; if (s) { applyPlan(s.plan, s.name, s.desc); go('comparison'); toast('Opened: ' + s.name); } break;
    case 'dup': var o = state.saved.filter(function (r) { return r.id === id; })[0]; if (o) { var nm = o.name + ' (copy)', n = 2; while (state.saved.some(function (r) { return r.name === nm; })) nm = o.name + ' (copy ' + n++ + ')'; state.saved.unshift({ id: uid(), name: nm, desc: o.desc, plan: JSON.parse(JSON.stringify(o.plan)), created: today() }); persistSaved(); renderPage(); toast('Duplicated.'); } break;
    case 'rename': state.renaming = id; renderPage(); var ri = $('#rn-' + id); if (ri) { ri.focus(); ri.select(); } break;
    case 'rename-ok': var v = ($('#rn-' + id).value || '').trim(); if (!v) { toast('A name is required.'); break; } if (state.saved.some(function (r) { return r.id !== id && r.name.toLowerCase() === v.toLowerCase(); })) { toast('Another scenario already has that name.'); break; } state.saved.forEach(function (r) { if (r.id === id) r.name = v; }); state.renaming = null; persistSaved(); renderPage(); toast('Renamed.'); break;
    case 'delete': state.confirm = id; renderPage(); break;
    case 'delete-cancel': state.confirm = null; renderPage(); break;
    case 'delete-ok': state.saved = state.saved.filter(function (r) { return r.id !== id; }); state.cmp = state.cmp.filter(function (c) { return c !== id; }); state.confirm = null; persistSaved(); renderPage(); toast('Scenario deleted.'); break;
    case 'try-cand': var cands = scoreCandidates(buildCandidates(), state.weights), c = cands[+t.getAttribute('data-i')]; if (c) { applyPlan(c.plan, CAND_META[c.key].title + ' in ' + c.zoneName, 'Single intervention from the ranked list. Adjust it or add more changes.'); state.selZone = c.zoneId; go('simulator'); toast('Loaded into the simulator.'); } break;
    case 'run-opt':
      state.budgetLakh = clamp(+($('#budget').value) || 150, 5, 2000); state.optBusy = true; renderPage();
      setTimeout(function () { state.opt = runOptimizer(); state.optBusy = false; renderPage(); announce('Optimizer finished'); }, 40); break;
    case 'load-opt': if (state.opt && state.opt.best) { applyPlan(state.opt.best.plan, 'Optimized plan, ₹' + n0(state.budgetLakh) + ' lakh budget', 'Found by the plan optimizer for the current weights and budget.'); go('simulator'); toast('Optimized plan loaded.'); } break;
    case 'reset-zone': var dz = CT.DEMO_ZONES.filter(function (z) { return z.id === zid; })[0]; state.zones = state.zones.map(function (z) { return z.id === zid ? JSON.parse(JSON.stringify(dz)) : z; }); persistZones(); state.plan = sanitizePlan(state.plan); touch(); renderPage(); toast('Demo values restored for this zone.'); break;
    case 'reset-all-zones': state.zones = cloneZones(CT.DEMO_ZONES); persistZones(); state.plan = sanitizePlan(state.plan); touch(); renderPage(); toast('Demo layout restored.'); break;
    case 'reset-settings': state.settings = CT.withDefaults({}); persistSettings(); state.plan = sanitizePlan(state.plan); touch(); renderPage(); toast('Assumptions reset to defaults.'); break;
    case 'clear-all': state.confirm = 'clear-all'; renderPage(); break;
    case 'clear-ok': state.saved = []; state.cmp = []; state.zones = cloneZones(CT.DEMO_ZONES); LS.del('saved'); LS.del('zones'); state.plan = {}; state.name = 'Baseline reference'; state.desc = 'No changes applied. This is the current campus layout.'; state.confirm = null; touch(); renderPage(); toast('Saved data cleared.'); break;
    case 'load-examples': var na = loadExamples(); renderPage(); toast(na ? 'Loaded ' + na + ' example scenarios. Compare them below.' : 'Examples are already saved. They are ticked for comparison below.'); break;
    case 'start-tour': state.tour = 0; tourStep(); break;
    case 'tour-next': if (state.tour >= TOUR.length - 1) { endTour(); } else { state.tour++; tourStep(); } break;
    case 'tour-prev': if (state.tour > 0) { state.tour--; tourStep(); } break;
    case 'tour-end': endTour(); break;
  }
});
function selectZone(id) { state.selZone = id; state.editOpen = false; renderPage(); var n = $('.zone[data-zone="' + id + '"]'); if (n) n.focus({ preventScroll: true }); }
function tourStep() {
  var s = TOUR[state.tour];
  if (s.page === 'simulator' && planIsEmpty()) { var p = presetById('combined'); applyPlan(p.plan, p.name, p.desc); }
  if (s.page === 'twin') state.selZone = 'z3';
  go(s.page, { noFocus: true }); $('#tour-root').innerHTML = tourHtml();
}
function endTour() { state.tour = null; $('#tour-root').innerHTML = ''; }

document.addEventListener('keydown', function (e) {
  var z = e.target.closest && e.target.closest('.zone');
  if (z && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectZone(z.getAttribute('data-zone')); return; }
  if (e.key === 'Escape') {
    if (state.modal) { closeModal(); return; }
    if (state.tour != null) { endTour(); return; }
    if (state.menuOpen) { state.menuOpen = false; render(); }
  }
  if (e.key === 'Tab' && state.modal) {
    var m = $('.modal'); if (!m) return;
    var f = $$('button, input, textarea, select, [href]', m).filter(function (n) { return !n.disabled; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- inputs ---------- */
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.hasAttribute('data-iv')) { markCustom(); setIv(state.selZone, el.getAttribute('data-iv'), +el.value); updateSimLive(); return; }
  if (el.id === 'scn-name') { state.name = el.value; var tb = $('#topbar'); if (tb) tb.innerHTML = topbar(); return; }
  if (el.id === 'scn-desc') { state.desc = el.value; return; }
  if (el.hasAttribute('data-w')) { var k = el.getAttribute('data-w'); state.weights[k] = +el.value; var o = $('#wo-' + k); if (o) o.textContent = el.value; return; }
  if (el.hasAttribute('data-ed')) { var tot = 0; CT.COVER_KEYS.forEach(function (k) { var i = $('#ed-' + k); tot += Math.max(0, +i.value || 0); }); var te = $('#ed-total'); if (te) te.textContent = 'Zone area: ' + n0(tot) + ' m²'; }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.hasAttribute('data-w')) { renderPage(); return; }
  if (el.id === 'budget') { state.budgetLakh = clamp(+el.value || 150, 5, 2000); el.value = state.budgetLakh; return; }
  if (el.getAttribute('data-action') === 'cmp-pick') {
    var id = el.getAttribute('data-id'), i = state.cmp.indexOf(id);
    if (el.checked && i < 0) state.cmp.push(id); if (!el.checked && i >= 0) state.cmp.splice(i, 1);
    if (state.cmp.length > 3) state.cmp = state.cmp.slice(-3);
    renderPage(); return;
  }
  if (el.hasAttribute('data-set') || el.hasAttribute('data-cost')) saveSetting(el);
});
function saveSetting(el) {
  var msg = $('#settings-msg'), v = +el.value, min = el.getAttribute('min') != null ? +el.getAttribute('min') : -Infinity, max = el.getAttribute('max') != null ? +el.getAttribute('max') : Infinity;
  if (!isFinite(v) || el.value === '' || v < min || v > max) {
    msg.className = 'formmsg'; msg.textContent = 'Enter a value between ' + min + ' and ' + (isFinite(max) ? max : 'any') + '. The previous value was kept.';
    var cur = el.hasAttribute('data-cost') ? state.settings.costs[el.getAttribute('data-cost')] : state.settings[el.getAttribute('data-set')];
    el.value = cur; return;
  }
  if (el.hasAttribute('data-cost')) state.settings.costs[el.getAttribute('data-cost')] = v; else state.settings[el.getAttribute('data-set')] = v;
  persistSettings(); state.plan = sanitizePlan(state.plan); touch();
  msg.className = 'formmsg ok'; msg.textContent = 'Saved. Results use the new value.';
}
document.addEventListener('submit', function (e) {
  var f = e.target;
  if (f.getAttribute('data-form') !== 'edit-zone') return;
  e.preventDefault();
  var z = zoneById(state.selZone), vals = {}, msg = $('#ed-msg'), bad = null, tot = 0;
  CT.COVER_KEYS.concat(['coolingKwh']).forEach(function (k) {
    var i = $('#ed-' + k), v = i.value === '' ? NaN : +i.value;
    if (!isFinite(v) || v < 0) bad = bad || [i, CT.COVER_LABELS[k] || 'Cooling electricity'];
    vals[k] = v; if (k !== 'coolingKwh') tot += v;
  });
  if (bad) { msg.textContent = bad[1] + ' must be a number, zero or more.'; bad[0].focus(); return; }
  if (tot < 500) { msg.textContent = 'The zone area is only ' + n0(tot) + ' m². Enter at least 500 m² in total.'; return; }
  CT.COVER_KEYS.concat(['coolingKwh']).forEach(function (k) { z[k] = vals[k]; });
  persistZones(); state.plan = sanitizePlan(state.plan); touch(); state.editOpen = false; renderPage(); toast('Baseline updated for ' + z.name + '.');
});

/* ---------- boot ---------- */
(function boot() {
  root = document.getElementById('root');
  loadState();
  state.page = 'home';
  try { var h = (location.hash || '').replace('#', ''); if (PAGES.some(function (p) { return p.id === h; })) state.page = h; } catch (e) { }
  render();
})();
